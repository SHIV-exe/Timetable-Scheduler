<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" width="100%" height="100%" style="font-family: -apple-system, BlinkMacSystemFont, 'Geist Sans', 'Helvetica Neue', sans-serif;">
  <rect width="700" height="400" fill="#FFFFFF" rx="8" stroke="#EAEAEA" stroke-width="1"/>
  <text x="70" y="26" font-size="14" font-weight="600" fill="#111111">Min-Conflicts: Cost vs Iterations (Large Dataset, Seed 0)</text>
  
  <!-- Grid lines -->
  <line x1="70" y1="350" x2="670" y2="350" stroke="#EAEAEA" stroke-width="1"/>
  <line x1="70" y1="40" x2="70" y2="350" stroke="#EAEAEA" stroke-width="1"/>
  
  <!-- Line Plot -->
  <polyline fill="none" stroke="#111111" stroke-width="2" points="70.0,350.0"/>
  
  <!-- Axis Labels -->
  <text x="350.0" y="385" text-anchor="middle" font-size="12" fill="#787774">Iteration</text>
  <text x="18" y="200.0" text-anchor="middle" font-size="12" fill="#787774" transform="rotate(-90 18 200.0)">Cost (1000 x Hard + Soft) (log scale)</text>
</svg>